<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --infield:#1E3A5F;      /* antet: bleumarin */
  --track:#D4A017;        /* accent: auriu */
  --chalk:#F5F7FA;        /* fundal */
  --card:#FFFFFF;
  --ink:#1B2430;
  --muted:#6B7685;
  --border:#D9E0E8;
  --ok:#2E7D4F;
  --danger:#C0392B;
  --yellow:#FFF4CC;
  --dor:#E3EEFB;          /* Dorohoi */
  --sen:#E6F4EA;          /* Șendriceni */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--chalk);color:var(--ink);font-size:15px;line-height:1.45}
h1,h2,h3,.osw{font-family:Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:600}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px;margin:18px 0 8px}
header{background:var(--infield);color:#fff;border-bottom:4px solid var(--track);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:20px;margin:0;flex:1}
header small{display:block;font-family:Inter,sans-serif;text-transform:none;font-weight:400;font-size:12px;opacity:.8;letter-spacing:0}
#salvat{font-size:12px;opacity:.85;white-space:nowrap}
#menuBtn{display:none;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font-size:18px}
.layout{display:flex;min-height:calc(100vh - 60px)}
nav{width:210px;background:#fff;border-right:1px solid var(--border);padding:10px 0;flex-shrink:0}
nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:11px 18px;font-size:15px;color:var(--ink);cursor:pointer;border-left:4px solid transparent}
nav button:hover{background:#F0F3F7}
nav button.activ{border-left-color:var(--track);background:#FBF6E6;font-weight:600}
nav .badge{margin-left:auto}
main{flex:1;padding:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:26px;font-family:Oswald,sans-serif}
.kpi span{color:var(--muted);font-size:13px}
.kpi.rau b{color:var(--danger)} .kpi.bun b{color:var(--ok)}
button.btn,.btn{background:var(--infield);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:15px;cursor:pointer;font-family:inherit}
.btn.sec{background:#fff;color:var(--infield);border:1px solid var(--infield)}
.btn.acc{background:var(--track);color:#1B2430}
.btn.rosu{background:var(--danger)}
.btn.mic{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5}
select,input,textarea{font-size:16px;font-family:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:70px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--border);padding:6px 8px;vertical-align:top;font-size:14px}
th{background:#EEF2F6;text-align:left;font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:#F8FAFC}
.grid td.cel{min-width:130px;height:62px;cursor:pointer;position:relative}
td.mutat{background:#FFF4C2 !important}
.grid td.cel:hover{outline:2px solid var(--track);outline-offset:-2px}
.grid td.gol{background:#FAFBFC}
.grid td.err{box-shadow:inset 0 0 0 2px var(--danger)}
.grid td.warn{box-shadow:inset 0 0 0 2px #E6A100}
.grid td.sel{outline:3px solid var(--track);outline-offset:-3px;background:#FFF9E5}
.grid td.ora{width:92px;white-space:nowrap;background:#EEF2F6;font-size:12px;color:var(--muted)}
.grid td.ora b{font-size:15px;color:var(--ink);display:block}
.disc{font-weight:600;font-size:13px;line-height:1.25}
.prof{font-size:12px;color:var(--muted);margin-top:2px}
.per{display:inline-block;font-size:10px;border-radius:4px;padding:0 4px;margin-left:3px;background:#E8EDF3;color:var(--infield);font-weight:700}
.loc-Dorohoi{background:var(--dor)} .loc-Șendriceni{background:var(--sen)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--border);background:#fff}
.tag.Dorohoi{background:var(--dor);border-color:#B9D2F2} .tag.Șendriceni{background:var(--sen);border-color:#B7DEC3}
.badge{display:inline-block;min-width:22px;text-align:center;border-radius:999px;font-size:12px;padding:1px 7px;background:var(--danger);color:#fff;font-weight:700}
.badge.galben{background:#E6A100}
.badge.verde{background:var(--ok)}
.niv-eroare{border-left:5px solid var(--danger)} .niv-avertisment{border-left:5px solid #E6A100} .niv-info{border-left:5px solid #7A8AA0}
.item{padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff;display:flex;gap:10px;align-items:flex-start}
.item .t{flex:1}
.muted{color:var(--muted)} .ok{color:var(--ok)} .rau{color:var(--danger)}
.banner{background:var(--yellow);border:1px solid #E8D48A;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1B2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;z-index:60;max-width:90vw;pointer-events:none}
#toast.vizibil{opacity:.95}
.modal-fundal{position:fixed;inset:0;background:rgba(10,20,35,.45);display:none;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 12px}
.modal-fundal.deschis{display:block}
.modal{background:#fff;border-radius:12px;max-width:620px;margin:0 auto;padding:18px;border-top:4px solid var(--track)}
.modal h3{margin-top:0}
.pr-linie{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pr-linie select{flex:1;min-width:160px}
#printArea{display:none}
/* Planșa – ca foaia din Excel */
table.plansa{border-collapse:collapse;width:auto;background:#fff;font-family:Calibri,"Segoe UI",Inter,sans-serif}
table.plansa th,table.plansa td{border:1px solid #555;padding:2px 4px;text-align:center;vertical-align:middle;font-size:11px;line-height:1.15}
table.plansa .tit{border:0;font-weight:700;font-size:13px;background:#fff;text-align:left}
table.plansa .cl{font-size:24px;font-weight:700;background:#E0E0E0;min-width:118px}
table.plansa .hd{font-size:10px;font-weight:700;background:#E0E0E0}
table.plansa .lab{font-weight:700;background:#E0E0E0;font-size:13px;min-width:92px}
table.plansa .zi{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;background:#BFBFBF;font-size:13px;letter-spacing:.08em;width:24px}
table.plansa .nr{font-weight:700;width:22px;background:#fff}
table.plansa .tm{font-weight:700;background:#BFBFBF;font-size:12px;white-space:nowrap;text-align:left}
table.plansa td.s{font-size:10px;height:40px;min-width:118px;max-width:150px;cursor:pointer;text-transform:uppercase}
table.plansa td.s small{display:block;color:#444;font-size:9px;text-transform:none;margin-top:1px}
table.plansa td.s:hover{outline:2px solid var(--track);outline-offset:-2px}
table.plansa td.err{background:#FDE2DF} table.plansa td.warn{background:#FFF1C9}
table.plansa .gap{border:0;width:14px;background:#fff}
table.plansa th.pn{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:700;background:#E0E0E0;height:150px;width:34px;white-space:nowrap}
table.plansa td.t{font-size:10px;width:34px;white-space:nowrap}
table.plansa td.t.alt{color:#7A4B00}
table.plansa td.t.locD{background:#9BC2E6}
table.plansa td.t.locS{background:#A9D08E}
table.plansa td.t.pachet{background:#F4B084;white-space:normal;line-height:1.1}
table.plansa td.t small{display:block;font-size:8px;color:#333}
table.plansa td.t{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.leg-plansa span{display:inline-block;padding:2px 8px;margin-right:6px;border:1px solid #999;border-radius:3px;font-size:12px}
table.plansa tr.inc-zi td,table.plansa tr.inc-zi th{border-top:3px solid #111}
table.plansa .gol{background:#fff}

@media (max-width:820px){
  #menuBtn{display:block}
  nav{position:fixed;top:0;left:0;bottom:0;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.2);padding-top:70px;width:240px}
  nav.deschis{transform:none}
  main{padding:12px}
  .grid td.cel{min-width:112px}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:11px}
  header,nav,main,.layout,#toast,.modal-fundal{display:none!important}
  #printArea{display:block}
  .pagina{page-break-after:always}
  .pagina:last-child{page-break-after:auto}
  .pagina h2{font-size:16px;margin:0 0 4px}
  .pagina table td,.pagina table th{font-size:10px;padding:3px 5px}
  .grid td.cel{height:auto;min-width:0}
  table.plansa td.s{height:auto;min-width:0}
  table.plansa td.err,table.plansa td.warn{background:#fff}
}
</style>
</head>
<body>
<header>
  <button id="menuBtn" onclick="document.querySelector('nav').classList.toggle('deschis')" aria-label="Meniu">☰</button>
  <h1><span id="titluAn">Orar 2026–2027</span><small>Liceul Tehnologic „Al. Vlahuță” Șendriceni</small></h1>
  <span id="salvat"></span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="modal-fundal" id="modal" onclick="if(event.target===this)inchideModal()"><div class="modal" id="modalCont"></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
"use strict";
/* ============================================================
   APLICAȚIA ORAR – versiunea 1 (editor cu verificări)
   Datele inițiale: ORAR 2026-2027.xlsm + încadrarea
   „CATEDRE AN SCOLAR 2026-2027 FINAL 28 09 2026”.
   ============================================================ */
const DATA_INITIAL = /*__DATA__*/null;
/* Orarul reorganizat (13.11.2026): mai puține zile în două locații (R2) și mai puține ferestre (R13). */
const PROPUNERE = /*__PROPUNERE__*/null;
const KEY = "orar_state_v1";
const ZILE = ["Luni","Marți","Miercuri","Joi","Vineri"];
const PERIOADE = {T:"tot anul", P1:"prima perioadă", P2:"a doua perioadă", A:"alternanță"};
const TABURI = [
  {id:"azi", t:"Azi", i:"📅"},
  {id:"dash", t:"Dashboard", i:"📊"},
  {id:"clase", t:"Orar pe clase", i:"🏫"},
  {id:"prof", t:"Orar pe profesori", i:"👤"},
  {id:"plansa", t:"Planșa (ca în Excel)", i:"🗂"},
  {id:"cls", t:"Clase și planuri", i:"🎓"},
  {id:"profi", t:"Profesori și încadrare", i:"🧑‍🏫"},
  {id:"inc", t:"Încadrare (tabel)", i:"📋"},
  {id:"ver", t:"Verificări", i:"✅"},
  {id:"reg", t:"Reguli", i:"📐"},
  {id:"date", t:"Date și setări", i:"💾"}
];
const REGULI_INITIALE = [
  {id:"R1", text:"Locații: Dorohoi, Șendriceni (liceul), Ghilea (școala gimnazială); fiecare oră are locația ei.", auto:"Locația vine din clasă; Ghilea nu e în acest orar."},
  {id:"R2", text:"Un profesor stă toată ziua într-o singură locație, cât se poate.", auto:"Avertisment când un profesor are în aceeași zi ore la Dorohoi și la Șendriceni."},
  {id:"R3", text:"Pentru fiecare profesor se stabilesc dinainte: locația, catedra pe obiecte, numărul de ore, restricțiile pe zile.", auto:"Catedra și orele vin din încadrare; restricțiile pe zile vin în versiunea următoare."},
  {id:"R4", text:"Alternanțe de profesori la aceeași oră: o săptămână unul, următoarea altul, sau pe perioade (de exemplu primele 5 săptămâni unul, apoi altul).", auto:"Fiecare profesor dintr-o celulă are perioada lui: tot anul, prima perioadă, a doua perioadă sau alternanță."},
  {id:"R5", text:"Practica (APLICAȚII) se face în atelierele de la Șendriceni, de obicei zi întreagă, cu maistru instructor.", auto:""},
  {id:"R6", text:"Ordinea la conceperea orarului: întâi zilele de practică, apoi profesorii de cultură generală.", auto:"Se aplică în generator (versiunea următoare)."},
  {id:"R7", text:"Fiecare clasă are ora 1 în fiecare zi; nicio clasă nu poate începe de la ora 2. (Reconfirmată pe 13.11.2026.)", auto:"Eroare când o clasă nu are ora 1 sau are o fereastră în zi."},
  {id:"R8", text:"Fiecare clasă are un anumit număr de ore pe săptămână, în funcție de anul de studiu.", auto:"Eroare când orele din orar diferă de cele din încadrare."},
  {id:"R9", text:"Fiecare clasă are un anumit număr de săptămâni de practică comasată, la agenți economici; dacă nu se găsesc agenți economici pentru toți elevii clasei, clasa rămâne și face practica comasată în atelierul școlii, cu profesorul desemnat conform încadrării.", auto:"Orele de stagiu din încadrare nu se pun în orarul săptămânal."},
  {id:"R10", text:"Catedra unui profesor = 20 ore/săptămână × 36 săptămâni (720); maistrul instructor = 26 × 36 (936).", auto:"Norma se calculează din încadrare: ore ÷ 720, iar orele de instruire practică ÷ 936."},
  {id:"R11", text:"Unele clase au în planul de învățământ mai multe sau mai puține săptămâni pe an școlar; trebuie identificate și stabilite din planul-cadru.", auto:"Săptămânile fiecărei clase se pot modifica în Date și setări."},
  {id:"R13", text:"Profesorii nu au ferestre (ore libere între două ore în aceeași zi), cât se poate. R2 (o singură locație pe zi) este mai grea și are prioritate.", auto:"Avertisment pentru fiecare zi în care un profesor are fereastră."},
  {id:"R14", text:"La disciplinele de cultură generală, o clasă are cel mult 2 ore pe zi din aceeași disciplină (de exemplu, nu 3 ore de Limba română în aceeași zi).", auto:"Eroare când o disciplină de cultură generală are 3 sau mai multe ore în aceeași zi la o clasă."},
  {id:"R15", text:"Un profesor care are în aceeași zi ore în ambele locații se mută o singură dată (de exemplu Șendriceni → Dorohoi), nu dus-întors (Șendriceni → Dorohoi → Șendriceni).", auto:"Eroare când un profesor schimbă locația de mai multe ori în aceeași zi."},
  {id:"R16", text:"Între ore în locații diferite, un profesor are nevoie de cel puțin 15 minute pentru drum, socotite după programul orelor din fiecare locație (de exemplu, marți: Șendriceni ora a 2-a se termină la 9:25, Dorohoi ora a 3-a începe la 10:00 – merge).", auto:"Eroare când timpul dintre ultima oră într-o locație și prima oră în cealaltă e sub 15 minute."},
  {id:"R17", text:"Când un profesor are ore în ambele locații în aceeași zi, întâi are ore la Șendriceni, apoi la Dorohoi (majoritatea profesorilor locuiesc în Dorohoi), cât se poate.", auto:"Avertisment când un profesor merge de la Dorohoi la Șendriceni."},
  {id:"R18", text:"Clasele care fac Aplicații practice în același atelier nu se suprapun. Directorul pune întâi practica și repartizează clasele pe ateliere; abia apoi se așază orele de cultură generală și de specialitate.", auto:"Reorganizarea automată nu mută zilele de Aplicații practice. Verificarea pe ateliere vine după ce se stabilește atelierul fiecărei clase."},
  {id:"R19", text:"Practica e de două feluri: practica comasată (săptămâni întregi, la agenți economici sau în atelierul școlii) și Aplicațiile practice săptămânale în atelierele școlii, în pachete de 6 ore (o zi întreagă) cu maistrul instructor. Exemplu: X F are Aplicații practice joi și vineri.", auto:"Blocurile de 3+ ore la rând cu același profesor rămân neatinse la reorganizare."},
  {id:"R20", text:"Calitatea orarului: ore cât mai compacte și fără deplasări în două locații. Sunt situații în care deplasarea e necesară și nu există altă soluție (de exemplu, Pușcașu are o singură zi, cu ore în ambele locații).", auto:"Zilele în două locații apar ca avertismente R2; cele inevitabile rămân."},
  {id:"R21", text:"Profesorii care au ore la școala gimnazială din Ghilea pot avea în aceeași zi și ore la Șendriceni (2–4 minute cu mașina între școli).", auto:"Orarul de la Ghilea nu e în aplicație; zilele profesorilor nu se schimbă la reorganizare, ca să nu se strice orarul de la Ghilea."},
  {id:"R12", text:"Clasele a IX-a au Lăcătușărie generală cam primele 7 săptămâni, apoi pe aceleași ore au Bazele desenului tehnic cu Asaftei Lidia. [De rescris: în orarul actual, ziua de specialitate de la IX F și IX G are Dohotariu Viorel în prima perioadă și Pohoață Mihaela în a doua, câte 15 săptămâni.]", auto:""}
];
const NOTE_INITIALE = [
  "Legislație rutieră (laboratorul tehnologic de la modulul de conducere): o zi pe săptămână de 6 ore, la început de an, până se termină orele; apoi aceeași zi trece pe APLICAȚII. La mecanic agricol: 54 de ore, 9 săptămâni, curs unic pentru B și Tr.",
  "Orele de conducere sunt individuale, în afara orarului clasei. Mecanic agricol: 54 de ore pe elev (30 la B, 24 la Tr).",
  "IX F și IX G: modulele de specialitate se fac câte 6 ore, o zi pe săptămână, până se termină orele conform programei.",
  "XII I, Educație fizică: Ștefan Nicolae a făcut primele 6 ore, Daniel Botezatu continuă până la finalul anului.",
  "APLICAȚII pot fi făcute de maistru instructor sau de inginer; cine le face e normat ca maistru (26 ore). La un profesor cu ore de teorie și de APLICAȚII, norma se calculează separat pe fiecare tip.",
  "Zile de 7 ore: la Dorohoi doar lunea; la Șendriceni de luni până joi; vinerea 6 ore peste tot."
];

let state = null;
let tab = "azi";
let saveTimer = null;
let undoStack = [];
let selClasa = null, selProf = null, aziZi = null;
let swapMode = false, swapSel = null;
let filtruInc = {p:"", c:"", text:"", doarOrar:true};
let filtruVer = {eroare:true, avertisment:true, info:true};
let cacheVer = null;
let plansaLoc = "Șendriceni", plansaBloc = "ambele";

/* ---------- utilitare ---------- */
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round(n*100)/100).toLocaleString("ro-RO", {maximumFractionDigits:2});
const ro = (a,b) => a.localeCompare(b, "ro");
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("vizibil"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("vizibil"), 2600); }
function scurt(p){ const w=p.split(" "); return w.length>1 ? w[0]+" "+w[w.length-1][0]+"." : p; }
function azi(){ return new Date().toLocaleDateString("ro-RO"); }

/* ---------- date: încărcare, migrare, salvare ---------- */
function load(){
  try{ const s = localStorage.getItem(KEY); if(s) state = JSON.parse(s); }catch(e){ state = null; }
  if(!state) state = clone(DATA_INITIAL);
  migreazaDate();
}
/* Completează câmpurile lipsă; nu șterge nimic. */
function migreazaDate(){
  state.reguli ??= clone(REGULI_INITIALE);
  for(const id of ["R13","R14","R15","R16","R17","R18","R19","R20","R21"]) if(!state.reguli.some(r => r.id === id)) state.reguli.push(clone(REGULI_INITIALE.find(r => r.id === id)));

function planDinIncadrare(c){

function oreSapt(r){ const c = clasa(r.clasa); return c ? r.oreAn / c.saptamani : 0; }
function incClasa(c){ return state.incadrare.filter(r => r.clasa === c && r.inOrar).reduce((s,r) => s + oreSapt(r), 0); }

/* Norma (R10): ore pe an ÷ 720; instruirea practică (PIP) ÷ 936. Include stagiile și conducerea. */
function norma(p){
  let n = 0;
  for(const r of state.incadrare.filter(r => r.p === p)) n += r.oreAn / (r.tip === "PIP" ? 936 : 720);
  return n;

/* Index: unde e fiecare profesor și câte ore are la fiecare clasă. */
function index(){
  const prof = {}, pereche = {};
  for(const cl of state.clase){
    for(const z of ZILE){
      const zi = state.orar[cl.id][z] || {};
      for(const h of Object.keys(zi)){
        const x = zi[h];
        for(const pr of x.prof || []){
          prof[pr.p] ??= {}; prof[pr.p][z] ??= {}; prof[pr.p][z][h] ??= [];
          prof[pr.p][z][h].push({c: cl.id, per: pr.per, disc: x.disc, loc: cl.locatie});
          const k = pr.p + "|" + cl.id;
          pereche[k] ??= {fx:0, al:0};
          if(pr.per === "T") pereche[k].fx++; else pereche[k].al++;
        }
      }
    }
  }
  return {prof, pereche};
}
/* Două prezențe ale aceluiași profesor la aceeași oră sunt compatibile doar dacă sunt în perioade diferite. */
function compatibile(a, b){ return (a.per === "P1" && b.per === "P2") || (a.per === "P2" && b.per === "P1"); }

/* Statistici R2 și ferestre pentru un orar oarecare */
function statOrar(orar){
  const occ = {}, loc = {};
  state.clase.forEach(c => loc[c.id] = c.locatie);
  for(const c of Object.keys(orar)) for(const z of ZILE) for(const [h, x] of Object.entries(orar[c]?.[z] || {})) for(const p of (x?.prof || [])){
    ((occ[p.p] ??= {})[z] ??= {})[h] = 1; ((occ[p.p].loc ??= {})[z] ??= new Set()).add(loc[c]);
  }
  let r2 = 0, f = 0;
  for(const p in occ) for(const z of ZILE){
    const o = Object.keys(occ[p][z] || {}).map(Number); if(!o.length) continue;
    f += Math.max(...o) - Math.min(...o) + 1 - o.length;
    if(occ[p].loc[z].size > 1) r2++;
  }
  return {r2, f};
}

/* ---------- VERIFICĂRI ---------- */
const normDisc = t => (t || "").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Z0-9/]/g, "");
/* O celulă e de cultură generală dacă profesorii ei au la clasă doar ore CG (sau dirigenție). */
function esteCG(c, x){
  if(!x.prof?.length) return false;
  const t = new Set(); state.incadrare.filter(r => r.clasa === c && r.inOrar && x.prof.some(p => p.p === r.p)).forEach(r => t.add(r.tip));
  return t.size > 0 && [...t].every(k => ["CG","O-CO","O-DIRIG"].includes(k));
}
function verifica(){
  if(cacheVer) return cacheVer;
  const L = [];
  const add = (nivel, regula, text, ex = {}) => L.push({nivel, regula, text, ...ex});
  const I = index();
  // Clase: R7, maximul de ore pe zi în locație, celule incomplete, total ore (R8)
  for(const cl of state.clase){
    const c = cl.id, max = state.locatiiMaxOre[cl.locatie] || {};
    let total = 0;
    for(const z of ZILE){
      const zi = state.orar[c][z] || {};
      const ore = Object.keys(zi).filter(h => areContinut(zi[h])).map(Number).sort((a,b) => a-b);
      total += ore.length;
      if(ore.length && !ore.includes(1)) add("eroare","R7",`${c}, ${z}: nu are ora 1.`,{clasa:c,zi:z,ora:1});
      if(ore.length) for(let h = 1; h < ore[ore.length-1]; h++) if(!ore.includes(h) && h !== 1) add("eroare","R7",`${c}, ${z}: fereastră la ora ${h}.`,{clasa:c,zi:z,ora:h});
      if(max[z]) ore.filter(h => h > max[z]).forEach(h => add("eroare","Locație",`${c}, ${z}: ora ${h} depășește maximul de ${max[z]} ore pe zi la ${cl.locatie}.`,{clasa:c,zi:z,ora:h}));
      // R14: cultură generală – cel mult 2 ore pe zi din aceeași disciplină
      const nCG = {};
      for(const h of ore){ const x = zi[h]; if(x.disc && esteCG(c, x)){ const k = normDisc(x.disc); (nCG[k] ??= {n:0, d:x.disc, h:[]}); nCG[k].n++; nCG[k].h.push(h); } }
      Object.values(nCG).filter(v => v.n > 2).forEach(v => add("eroare","R14",`${c}, ${z}: ${v.n} ore de ${v.d} (orele ${v.h.join(", ")}); la cultura generală sunt maximum 2 pe zi.`,{clasa:c,zi:z,ora:v.h[2]}));
      for(const h of ore){
        const x = zi[h];
        if(x.disc && !x.prof.length) add("eroare","Celulă",`${c}, ${z}, ora ${h}: „${x.disc}” nu are profesor.`,{clasa:c,zi:z,ora:h});
        if(!x.disc && x.prof.length) add("avertisment","Celulă",`${c}, ${z}, ora ${h}: are profesor, dar nu are disciplină.`,{clasa:c,zi:z,ora:h});
      }
    }
    const inc = incClasa(c);
    if(Math.abs(inc - total) > 0.5) add("eroare","R8",`${c}: ${total} ore pe săptămână în orar, ${fmt(inc)} în încadrare (diferență ${fmt(total - inc)}).`,{clasa:c});
  }
  // Planul clasei față de încadrare (disciplinele trecute în „Clase și planuri”)
  for(const cl of state.clase){
    if(!cl.discipline?.length) continue;
    const A = acoperire(cl);
    A.filter(x => x.rest > 0.5).forEach(x => add("avertisment","Plan",`${cl.id}: ${x.it.d || "disciplină fără nume"} – ${fmt(x.rest / cl.saptamani)} ore/săpt. (${fmt(x.rest)} ore/an) fără profesor.`,{clasa:cl.id}));
    A.filter(x => x.rest < -0.5).forEach(x => add("avertisment","Plan",`${cl.id}: ${x.it.d} – încadrate cu ${fmt(-x.rest)} ore/an peste plan (${x.R.map(r => r.p).join(", ")}).`,{clasa:cl.id}));
    state.incadrare.filter(r => r.clasa === cl.id && !cl.discipline.some(it => potriveste(r, it))).forEach(r => add("avertisment","Plan",`${cl.id}: ${r.p} are „${r.disciplina}”${r.inOrar ? "" : " (în afara orarului)"}, care nu e în disciplinele clasei.`,{clasa:cl.id, prof:r.p}));
  }
  // Profesori: suprapuneri și locații (R2)
  for(const [p, zile] of Object.entries(I.prof)){
    if(!state.incadrare.some(r => r.p === p)) add("eroare","Încadrare",`${p} apare în orar, dar nu are încadrare.`,{prof:p});
    for(const z of ZILE){
      const zi = zile[z] || {};
      const locuri = new Set();
      for(const h of Object.keys(zi)){
        const L2 = zi[h]; L2.forEach(x => locuri.add(x.loc));
        const clase = [...new Set(L2.map(x => x.c))];
        if(clase.length > 1){
          let conflict = false, nesigur = false;
          for(let i = 0; i < L2.length; i++) for(let j = i+1; j < L2.length; j++){
            if(L2[i].c === L2[j].c) continue;
            if(compatibile(L2[i], L2[j])) continue;

          }
          if(conflict) add("eroare","Suprapunere",`${p}: ${z}, ora ${h}, e trecut(ă) în același timp la ${clase.join(" și ")}.`,{prof:p,zi:z,ora:h,clasa:clase[0]});
          else if(nesigur) add("avertisment","Suprapunere",`${p}: ${z}, ora ${h}, apare la ${clase.join(" și ")} cu alternanță nespecificată – verifică perioadele.`,{prof:p,zi:z,ora:h,clasa:clase[0]});
        }
      }
      if(locuri.size > 1) add("avertisment","R2",`${p}: ${z} are ore și la Dorohoi, și la Șendriceni.`,{prof:p,zi:z});
      const ocupate = Object.keys(zi).filter(h => zi[h].length).map(Number).sort((a, b) => a - b);
      if(locuri.size > 1){
        const sec = ocupate.map(h => zi[h][0].loc); let sch = 0;
        for(let i = 1; i < sec.length; i++) if(sec[i] !== sec[i-1]) sch++;
        if(sch > 1) add("eroare","R15",`${p}: ${z} merge dus-întors între locații (${sec.map(l => l[0]).join("→")}).`,{prof:p,zi:z});
        const min = t => t ? (+t.slice(0, 2)) * 60 + (+t.slice(3, 5)) : NaN;
        for(let i = 1; i < ocupate.length; i++){
          const la = sec[i-1], lb = sec[i]; if(la === lb) continue;
          const h1 = ocupate[i-1], h2 = ocupate[i];
          const sf = min((state.clopot[la]?.[z]?.[h1] || "").slice(6)), st = min((state.clopot[lb]?.[z]?.[h2] || "").slice(0, 5));
          if(!isNaN(sf) && !isNaN(st) && st - sf < 15) add("eroare","R16",`${p}: ${z}, ${la} ora ${h1} → ${lb} ora ${h2}: ${st - sf < 0 ? "orele se suprapun" : "doar " + (st - sf) + " minute"} pentru drum (trebuie 15).`,{prof:p,zi:z});
          if(la === "Dorohoi" && lb === "Șendriceni") add("avertisment","R17",`${p}: ${z} merge de la Dorohoi la Șendriceni (de preferat invers).`,{prof:p,zi:z});
        }
      }
      const goluri = [];
      for(let h = ocupate[0]; h < ocupate[ocupate.length - 1]; h++) if(!ocupate.includes(h)) goluri.push(h);
      if(goluri.length) add("avertisment","R13",`${p}: ${z} are ${goluri.length === 1 ? "fereastră la ora " + goluri[0] : goluri.length + " ferestre (orele " + goluri.join(", ") + ")"}${locuri.size > 1 ? " – zi cu ambele locații" : ""}.`,{prof:p,zi:z,ferestre:goluri.length});
    }
  }
  // Perechi profesor–clasă: orele din orar față de încadrare
  const chei = new Set(Object.keys(I.pereche));
  state.incadrare.filter(r => r.inOrar && clasa(r.clasa)).forEach(r => chei.add(r.p + "|" + r.clasa));
  for(const k of chei){
    const [p, c] = k.split("|");
    const inc = incPereche(p, c), o = I.pereche[k] || {fx:0, al:0};
    let ok;
    if(o.al === 0) ok = Math.abs(inc - o.fx) < 0.35 && Math.round(inc) === o.fx;
    else ok = inc >= o.fx - 0.01 && inc <= o.fx + o.al + 0.01;
    if(ok) continue;
    if(inc === 0) add("eroare","Încadrare",`${p} are ${o.fx + o.al} ore în orar la ${c}, dar nu are ore la această clasă în încadrare.`,{prof:p,clasa:c});
    else if(o.fx + o.al === 0) add("avertisment","Încadrare",`${p} are în încadrare ${fmt(inc)} ore/săpt. la ${c}, dar nu apare în orar la această clasă.`,{prof:p,clasa:c});
    else add("avertisment","Încadrare",`${p} la ${c}: încadrare ${fmt(inc)} ore/săpt., orar ${o.fx}${o.al ? " + " + o.al + " în alternanță" : ""}.`,{prof:p,clasa:c});
  }
  cacheVer = L;
  return L;
}
function nrVer(nivel, f){ return verifica().filter(x => x.nivel === nivel && (!f || f(x))).length; }
function problemeCelula(c, z, h){
  const L = verifica().filter(x => x.clasa === c && x.zi === z && String(x.ora) === String(h));
  if(L.some(x => x.nivel === "eroare")) return "err";
  if(L.length) return "warn";
  return "";
}

function grilaClasa(c, opt = {}){
  const cl = clasa(c), zileOre = ZILE.map(z => Object.keys(state.orar[c][z] || {}).map(Number));
  const maxH = Math.max(6, ...zileOre.flat(), ...Object.values(state.locatiiMaxOre[cl.locatie] || {7:7}));
  let h = `<div class="scroll"><table class="grid"><tr><th>Ora</th>${ZILE.map(z => `<th>${z}</th>`).join("")}</tr>`;
  for(let o = 1; o <= maxH; o++){
    h += `<tr><td class="ora"><b>${o}</b>${esc(state.clopot[cl.locatie]?.Luni?.[o] || "")}</td>`;
    for(const z of ZILE){
      const x = state.orar[c][z][o];
      const cls = ["cel"]; if(!areContinut(x)) cls.push("gol"); if(!opt.print && celulaMutata(c, z, o)) cls.push("mutat");
      if(!opt.print){ const p = problemeCelula(c, z, o); if(p) cls.push(p); if(swapSel && swapSel.c === c && swapSel.z === z && String(swapSel.h) === String(o)) cls.push("sel"); }
      const on = opt.print ? "" : `onclick="clickCelula('${c}','${z}',${o})"`;

    }
    h += "</tr>";
  }
  return h + "</table></div>";
}
function grilaProf(p, opt = {}){
  const I = index(), zile = I.prof[p] || {};
  let maxH = 6; ZILE.forEach(z => Object.keys(zile[z] || {}).forEach(h => maxH = Math.max(maxH, +h)));
  let h = `<div class="scroll"><table class="grid"><tr><th>Ora</th>${ZILE.map(z => `<th>${z}</th>`).join("")}</tr>`;
  for(let o = 1; o <= maxH; o++){
    h += `<tr><td class="ora"><b>${o}</b></td>`;
    for(const z of ZILE){
      const L = (zile[z] || {})[o] || [];
      const clase = [...new Set(L.map(x => x.c))];
      let cls = "cel" + (L.length ? " loc-" + L[0].loc : " gol");
      if(!opt.print && clase.length > 1 && !(L.length === 2 && compatibile(L[0], L[1]))) cls += " err";

    }
    h += "</tr>";
  }
  return h + "</table></div>";
}

const codClasa = c => c; // cu spațiu, ca „XII I” să nu se confunde cu „XIII”
function codProf(x){ const k = codClasa(x.c); return x.per === "P1" ? k + "/" : x.per === "P2" ? "/" + k : x.per === "A" ? k + "*" : k; }
function plansaModel(loc){
  const clase = state.clase.filter(c => c.locatie === loc);

function redenumesteProf(v, nou){

/* Asocierea profesor–clasă: aplicația propune disciplinele din specialitățile profesorului, cu orele rămase; se pot schimba de mână. */
let asoc = null;
function asociazaClasa(p, c){ asoc = {p, c: c || "", val: null}; renderAsoc(); $("#modal").classList.add("deschis"); }
function renderAsoc(){
  const {p, c} = asoc, f = state.fise[p] || {specialitati:[]};
  let h = `<h3>Asociază o clasă · ${esc(p)}</h3><label>Clasa</label><select onchange="asoc.c=this.value;asoc.val=null;renderAsoc()" style="width:100%"><option value="">– alege clasa –</option>${state.clase.map(cl => `<option value="${esc(cl.id)}" ${cl.id === c ? "selected" : ""}>${esc(cl.id)} – ${esc(eticheta(cl))}</option>`).join("")}</select>`;

  if(cl){
    const A = acoperire(cl);
    const spec = it => (f.specialitati || []).some(s => normDisc(s) === normDisc(it.d));
    if(!asoc.val){
      asoc.val = {};
      for(const x of A){
        const al = x.R.filter(r => r.p === p).reduce((s, r) => s + r.oreAn, 0);
        const rest = Math.max(0, x.rest);
        asoc.val[x.i] = {on: al > 0, oreAn: al};

    }

    if(!A.length) h += `<p class="rau">Clasa ${esc(c)} nu are încă disciplinele trecute. Le adaugi în „Clase și planuri”.</p>`;
    else {
      h += `<p class="muted" style="font-size:13px">Sus sunt orele pe care le poate preda la ${esc(c)}, după specialitățile lui. Bifezi doar ce vrei să-i dai: la bifare primește orele rămase, iar tu le poți micșora (de exemplu, împarți orele între doi ingineri). Bifate de la început sunt doar orele pe care le are deja.</p>
      <div class="scroll"><table><tr><th></th><th>Disciplina</th><th class="num">Plan</th><th class="num">Orele lui</th></tr>
      ${[[poate, `Poate preda (specialitățile lui)${poate.length ? "" : " – nicio disciplină a clasei nu e în specialitățile lui"}`], [altele, "Celelalte discipline ale clasei"]].map(([G, tit]) => `<tr><th colspan="4" style="background:#FBF6E6">${tit}</th></tr>` + G.map(x => { const v = asoc.val[x.i], altii = x.R.filter(r => r.p !== p), alAltii = altii.reduce((s, r) => s + r.oreAn, 0);
        const peste = v.on && (alAltii + v.oreAn) > x.it.oreAn + 0.5, sp = x.it.inOrar;
        const cat = o => sp ? fmt(o / cl.saptamani) : fmt(o) + " pe an";
        return `<tr><td><input type="checkbox" ${v.on ? "checked" : ""} onchange="asoc.val[${x.i}].on=this.checked;if(this.checked&&!asoc.val[${x.i}].oreAn)asoc.val[${x.i}].oreAn=${Math.max(0, Math.round((x.it.oreAn - alAltii) * 100) / 100)};renderAsoc()"></td>
        <td>${esc(x.it.d)} <span class="muted" style="font-size:12px">${esc(x.it.tip)}${x.it.inOrar ? "" : " · nu e în orar"}</span>${spec(x.it) ? ' <span class="tag" style="background:#E6F4EA">specialitatea lui</span>' : ""}${altii.length ? `<div class="muted" style="font-size:12px">alții: ${altii.map(r => esc(scurt(r.p)) + " " + cat(r.oreAn)).join(", ")}</div>` : ""}</td>
        <td class="num">${cat(x.it.oreAn)}${alAltii > 0.5 ? `<div class="${x.it.oreAn - alAltii > 0.5 ? "muted" : "rau"}" style="font-size:11px">liber ${cat(Math.max(0, x.it.oreAn - alAltii))}</div>` : ""}</td>
        <td class="num"><input type="number" step="${sp ? 0.5 : 1}" min="0" value="${sp ? +(v.oreAn / cl.saptamani).toFixed(2) : v.oreAn}" style="width:52px" ${v.on ? "" : "disabled"} onchange="asoc.val[${x.i}].oreAn=${sp ? `Math.round((+this.value||0)*${cl.saptamani}*10)/10` : "+this.value||0"};renderAsoc()"><div class="muted" style="font-size:11px">${sp ? "pe săpt." : "pe an"}</div>${peste ? '<div class="rau" style="font-size:12px">peste plan</div>' : ""}</td></tr>`; }).join("")).join("")}</table></div>`;
      let n = norma(p);
      state.incadrare.filter(r => r.p === p && r.clasa === c && A.some(x => potriveste(r, x.it))).forEach(r => n -= r.oreAn / pondere(r));
      A.forEach(x => { const v = asoc.val[x.i]; if(v.on) n += v.oreAn / (x.it.tip === "PIP" ? 936 : 720); });
      const tot = A.reduce((s, x) => s + (asoc.val[x.i].on && x.it.inOrar ? asoc.val[x.i].oreAn / cl.saptamani : 0), 0);
      h += `<p style="margin-top:10px">La ${esc(c)}: <b>${fmt(tot)} ore/săpt.</b> în orar · norma lui după salvare: <b>${procent(n)}</b> (${fmt(n)} norme).</p>`;
    }
  }
  h += `<div class="row" style="margin-top:14px">${cl && cl.discipline.length ? `<button class="btn" onclick="salveazaAsoc()">Salvează încadrarea</button>` : ""}<span class="grow"></span><button class="btn sec" onclick="inchideModal()">Renunță</button></div>`;
  $("#modalCont").innerHTML = h;
}
function salveazaAsoc(){
  const {p, c, val} = asoc, cl = clasa(c);
  let n = 0;
  for(const x of acoperire(cl)){
    const v = val[x.i];
    // scoatem rândurile lui la această disciplină, apoi punem un singur rând cu orele alese
    state.incadrare = state.incadrare.filter(r => !(r.p === p && r.clasa === c && potriveste(r, x.it)));
    if(!v.on || !(v.oreAn > 0)) continue;
    const altii = state.incadrare.filter(r => r.clasa === c && potriveste(r, x.it)).reduce((s, r) => s + r.oreAn, 0);
    let oreAn = v.oreAn;
    const rest = x.it.oreAn - altii;
    if(Math.abs(oreAn - rest) < cl.saptamani * 0.05) oreAn = Math.round(rest * 100) / 100; // a luat tot ce rămânea: exact cât e în plan
    state.incadrare.push({p, clasa:c, disciplina:x.it.d, tip:x.it.tip, post:"", oreAn, inOrar:x.it.inOrar, motiv:x.it.inOrar ? "" : (x.it.motiv || "stagiu / practică comasată"), cdl:""});
    n++;
  }
  if(!state.profesori.includes(p)){ state.profesori.push(p); state.profesori.sort(ro); }
  saveState(); inchideModal(); render(); toast(`${p} – ${c}: ${n} ${n === 1 ? "disciplină" : "discipline"} în încadrare.`);
}

const PROFILURI = ["Tehnic","Servicii","Resurse naturale și protecția mediului"];

function urmeazaImplicit(cl){
  const m = cl.id.match(/^(IX|X|XI|XII)\s+(.+)$/); if(!m) return "";
  const urm = {IX:"X", X:"XI", XI:"XII"}[m[1]];
  if(!urm || (m[1] === "XI" && /profesional/i.test(cl.nivel))) return "";
  return urm + " " + m[2];
}
/* Clasa din anul următor: ce a scris Daniel în „În anul următor devine” (sau „iese”), altfel regula IX → X → XI → XII. */
function urmeaza(cl){
  const u = (cl.urmeaza || "").trim();
  if(/^(iese|-|—|nu)$/i.test(u)) return "";
  return u ? normClasa(u) : urmeazaImplicit(cl);
}
function excelProfesoriClase(){

  state.clase.forEach(c => rc.push([c.id, c.nivel, c.profil || "", c.domeniu || "", c.calificare || "", c.locatie, c.diriginte || "", c.saptamani, c.urmeaza || urmeazaImplicit(c) || "iese"]));

  return xlsx([

/* Cititor .xlsx fără biblioteci: arhiva zip + DecompressionStream + DOMParser. */
async function citesteXlsx(file){
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = buf.length - 22; while(e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if(e < 0) throw new Error("nu e un fișier Excel (.xlsx)");
  const n = dv.getUint16(e + 10, true); let off = dv.getUint32(e + 16, true);
  const td = new TextDecoder(), files = {};
  for(let i = 0; i < n; i++){

async function importProfesoriClase(f){

  const RP = gas("Profesori"), RC = gas("Clase");
  if(!RP && !RC){ toast("Fișierul nu are foile „Profesori” și „Clase”."); return; }
  // profesori

    P.set(nume, x); });
  const noiP = [...P.keys()].filter(p => !state.profesori.includes(p));
  // clase
  const C = [];
  (RC || []).slice(1).forEach(r => { if(!r) return; const id = normClasa(r[0]); if(!id) return;
    C.push({id, nivel:(r[1] || "").trim(), profil:(r[2] || "").trim(), domeniu:(r[3] || "").trim(), calificare:(r[4] || "").trim(), locatie:(r[5] || "").trim(), diriginte:(r[6] || "").trim(), saptamani:+r[7] || 0, urmeaza:(r[8] || "").trim()}); });

    cl.profil = x.profil; cl.domeniu = x.domeniu; cl.calificare = x.calificare;
    if(x.nivel) cl.nivel = /prof/i.test(x.nivel) ? "profesional" : "liceu";
    if(x.locatie){ const l = locs.find(l => normDisc(l) === normDisc(x.locatie)); if(l) cl.locatie = l; }
    cl.diriginte = x.diriginte; if(x.saptamani) cl.saptamani = x.saptamani;

  merges.push(`A1:${colL(Math.min(c0 + 2 + nP, 60))}1`);
  // legendă sub planșă
  rows.push([]); rows.push([{v:"Legendă (blocul profesorilor):", s:1}, , , {v:"oră la Șendriceni", s:12}, {v:"oră la Dorohoi", s:11}, {v:"pachet (dedesubt: cu cine)", s:13}]); heights.push(14, 22);
  return {name:"Plansa " + (loc === "Dorohoi" ? "Dorohoi" : "Sendriceni"), rows, widths:W, merges, heights, fit:true};
}
function construiesteExcel(){
  const B = v => ({v, b:true});
  const rc = [];
  for(const cl of state.clase){
    rc.push([B(`${cl.id} – ${eticheta(cl)} – ${cl.locatie} – diriginte ${cl.diriginte}`)]);
    rc.push([B("Ora"), ...ZILE.map(B)]);
    const maxH = Math.max(6, ...ZILE.flatMap(z => Object.keys(state.orar[cl.id][z]).map(Number)));
    for(let o = 1; o <= maxH; o++) rc.push([o, ...ZILE.map(z => textCelula(state.orar[cl.id][z][o]))]);
    rc.push([]);
  }
  const I = index(), rp = [];
  for(const p of state.profesori.filter(p => I.prof[p])){
    rp.push([B("Prof. " + p)]); rp.push([B("Ora"), ...ZILE.map(B)]);
    let maxH = 6; ZILE.forEach(z => Object.keys(I.prof[p][z] || {}).forEach(h => maxH = Math.max(maxH, +h)));
    for(let o = 1; o <= maxH; o++) rp.push([o, ...ZILE.map(z => ((I.prof[p][z] || {})[o] || []).map(x => `${x.c} – ${x.disc} (${x.loc})${x.per !== "T" ? " [" + (x.per === "A" ? "alternanță" : x.per) + "]" : ""}`).join("; "))]);
    rp.push([]);
  }
  const ri = [[B("Profesor"), B("Clasa"), B("Disciplina"), B("Tip"), B("Ore/an"), B("Ore/săpt."), B("În orar"), B("Motiv")]];
  state.incadrare.forEach(r => ri.push([r.p, r.clasa, r.disciplina, r.tip, r.oreAn, clasa(r.clasa) ? Math.round(oreSapt(r)*100)/100 : "", r.inOrar ? "da" : "nu", r.motiv || ""]));
  const rpl = [[B("Clasa"), B("Calificare"), B("Disciplina"), B("Tip"), B("Ore/săpt."), B("Ore/an"), B("În orar"), B("Încadrat"), B("Rămas (ore/an)")]];
  state.clase.forEach(cl => acoperire(cl).forEach(x => rpl.push([cl.id, eticheta(cl), x.it.d, x.it.tip, Math.round(x.it.oreAn / cl.saptamani * 100) / 100, x.it.oreAn, x.it.inOrar ? "da" : "nu", x.R.map(r => r.p + " " + fmt(r.oreAn / cl.saptamani)).join("; "), x.rest])));
  const rv = [[B("Nivel"), B("Regula"), B("Problema")]];
  verifica().forEach(x => rv.push([x.nivel, x.regula, x.text]));
  return xlsx([
    foaiePlansa("Șendriceni"),
    foaiePlansa("Dorohoi"),
    {name:"Orar pe clase", rows:rc, widths:[6,34,34,34,34,34]},
    {name:"Orar pe profesori", rows:rp, widths:[6,38,38,38,38,38]},
    {name:"Clase si planuri", rows:rpl, widths:[8,30,46,8,9,9,8,46,12]},
    {name:"Incadrare", rows:ri, widths:[30,8,50,8,9,9,8,26]},
    {name:"Verificari", rows:rv, widths:[13,14,110]}
  ]);
}
async function exportExcel(){
  try{ await trimiteFisier(construiesteExcel(), `orar-${dataFis()}.xlsx`); toast("Excel creat."); }
  catch(e){ toast("Exportul nu a reușit: " + e.message); }
}
